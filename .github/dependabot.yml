version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      time: "10:00"
    cooldown:
      default-days: 7
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "10:00"
    cooldown:
      default-days: 7
    groups:
      all-updates:
        patterns: ["*"]
